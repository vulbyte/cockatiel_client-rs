[workspace]

[package]
name = "cockatiel-client"
version = "0.1.0"
edition = "2021"
description = "Rust client SDK for connecting modules to the cockatiel engine"

[lib]
name = "cockatiel_client"
path = "src/cockatiel_lib.rs"

[[bin]]
name = "cockatiel-client"
path = "src/main.rs"

[dependencies]
cockatiel-proto = { git = "https://github.com/vulbyte/cockatiel_proto", rev = "012845421731ccd8a9fc3e58ad1e89a4e4900fbe" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
futures-util = "0.3"
uuid = { version = "1.0", features = ["v7"] }