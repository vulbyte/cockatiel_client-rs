[workspace]

[package]
name = "cockatiel-client"
version = "0.1.0"
edition = "2021"
description = "Rust client SDK for connecting modules to the cockatiel engine"

[lib]
name = "cockatiel_client"
path = "src/cockatiel_lib.rs"

[[bin]]
name = "cockatiel-client"
path = "src/main.rs"

[dependencies]
cockatiel-proto = { git = "https://github.com/vulbyte/cockatiel_proto", rev = "7b07c29a3d54356f53ae01b65db425fa3a5c4c02" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
futures-util = "0.3"
uuid = { version = "1.0", features = ["v7"] }